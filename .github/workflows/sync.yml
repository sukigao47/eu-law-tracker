name: 同步法规并发布网站

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync.yml
      - config/**
      - scripts/**
      - site/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/sync.yml
      - config/**
      - scripts/**
      - site/**
      - tests/**
  schedule:
    # UTC 11:24 corresponds to 19:24 in Asia/Shanghai.
    - cron: "24 11 * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: 重新读取每项法规的元数据
        type: boolean
        default: false

concurrency:
  group: eu-law-pages-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 同步官方数据
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 载入最近同步的目录
        uses: actions/cache@v5
        with:
          path: .catalog-cache
          key: eu-law-catalog-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: eu-law-catalog-v1-
      - name: 运行法规分类回归测试
        run: python -m unittest discover -s tests -v
      - name: 检查前端 JavaScript 语法
        run: node --check site/app.js
      - name: Restore published snapshot for fallback
        run: |
          mkdir -p site/data
          for file in catalog.json related-materials.json; do
            if curl --fail --silent --show-error --location --max-time 30 "https://sukigao47.github.io/eu-law-tracker/data/$file" -o "/tmp/$file"; then
              python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["documents"] and d["checkedAt"]' "/tmp/$file" && cp "/tmp/$file" "site/data/$file"
            fi
          done
      - name: 核对 Cellar 数据并筛选业务主题
        id: catalog_sync
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          arguments=(--cache .catalog-cache/catalog.json --profile config/terminal-lifecycle.json)
          if [[ "$REBUILD" == "true" ]]; then
            arguments+=(--rebuild)
          fi
          if python scripts/sync.py "${arguments[@]}"; then
            echo "result=updated" >> "$GITHUB_OUTPUT"
          else
            echo "result=fallback" >> "$GITHUB_OUTPUT"
            echo "::warning::CELLAR sync failed; retaining previous catalogue snapshot"
            python -c 'import json; d=json.load(open("site/data/catalog.json")); assert d["documents"] and d["checkedAt"]'
          fi
      - name: 同步软法及官方公报 C 系列资料
        id: related_sync
        run: |
          if timeout 180 python scripts/sync_related.py --profile config/terminal-lifecycle.json --output site/data/related-materials.json; then
            echo "result=updated" >> "$GITHUB_OUTPUT"
          else
            echo "result=fallback" >> "$GITHUB_OUTPUT"
            echo "::warning::Related materials sync failed; retaining previous snapshot"
            python -c 'import json; d=json.load(open("site/data/related-materials.json")); assert d["documents"] and d["checkedAt"]'
          fi
      - name: Restore Chinese translation cache
        uses: actions/cache@v5
        with:
          path: |
            .translation-cache
            ~/.local/share/argos-translate/packages
          key: eu-law-zh-v1-${{ github.run_id }}
          restore-keys: eu-law-zh-v1-
      - name: Translate all English titles into Chinese
        run: |
          python -m pip install argostranslate
          python scripts/translate_titles.py
      - name: Install browser acceptance test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test generated site in Chromium
        run: |
          python -m http.server 8765 --directory site &
          python scripts/browser_test.py
      - name: 生成法规数据更新报告
        if: always()
        env:
          CATALOG_SYNC_RESULT: ${{ steps.catalog_sync.outputs.result || 'not_run' }}
          RELATED_SYNC_RESULT: ${{ steps.related_sync.outputs.result || 'not_run' }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              file = Path(path)
              if not file.is_file():
                  return None
              with file.open(encoding="utf-8") as source:
                  return json.load(source)

          catalog = load("site/data/catalog.json")
          related = load("site/data/related-materials.json")
          lines = [
              "## 法规数据更新报告",
              "",
              f"- 报告生成时间（UTC）：{datetime.now(timezone.utc).isoformat(timespec='seconds')}",
              f"- EUR-Lex/CELLAR 法规目录同步：{os.environ.get('CATALOG_SYNC_RESULT', 'not_run')}",
              f"- 软法及官方公报 C 系列同步：{os.environ.get('RELATED_SYNC_RESULT', 'not_run')}",
          ]
          if catalog:
              lines.extend([
                  f"- 法规目录 checkedAt：{catalog.get('checkedAt', '缺失')}",
                  f"- 法规目录覆盖日期：{catalog.get('through', '缺失')}",
                  f"- 法规目录记录数：{len(catalog.get('documents', []))}",
              ])
          else:
              lines.append("- 法规目录：文件缺失")
          if related:
              coverage = related.get("coverage", {})
              lines.extend([
                  f"- 相关资料 checkedAt：{related.get('checkedAt', '缺失')}",
                  f"- 相关资料记录数：{len(related.get('documents', []))}",
                  f"- 软法业务相关记录：{coverage.get('softLawBusinessRelevant', '未知')}",
                  f"- 官方公报 C 系列业务相关记录：{coverage.get('ojCSeriesBusinessRelevant', '未知')}",
              ])
          else:
              lines.append("- 相关资料目录：文件缺失")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\\n".join(lines) + "\\n")
          PY
      # CJEU case-law ingestion is intentionally disabled per product-owner decision.
      # Official CURIA/EUR-Lex reference links remain available in the source registry.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test published website
        env:
          TEST_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/browser_test.py
