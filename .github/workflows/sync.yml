name: 同步法规并发布网站

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync.yml
      - config/**
      - scripts/**
      - site/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/sync.yml
      - config/**
      - scripts/**
      - site/**
      - tests/**
  schedule:
    # UTC 11:24 corresponds to 19:24 in Asia/Shanghai.
    - cron: "24 11 * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: 重新读取每项法规的元数据
        type: boolean
        default: false

concurrency:
  group: eu-law-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 同步官方数据
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 载入最近同步的目录
        uses: actions/cache@v5
        with:
          path: .catalog-cache
          key: eu-law-catalog-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: eu-law-catalog-v1-
      - name: 运行法规分类回归测试
        run: python -m unittest discover -s tests -v
      - name: 检查前端 JavaScript 语法
        run: node --check site/app.js
      - name: 核对 Cellar 数据并筛选业务主题
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          arguments=(--cache .catalog-cache/catalog.json --profile config/terminal-lifecycle.json)
          if [[ "$REBUILD" == "true" ]]; then
            arguments+=(--rebuild)
          fi
          python scripts/sync.py "${arguments[@]}"
      - name: 同步软法及官方公报 C 系列资料
        run: python scripts/sync_related.py --profile config/terminal-lifecycle.json --output site/data/related-materials.json
      - name: 同步欧盟法院判例
        run: python scripts/sync_case_law.py --profile config/terminal-lifecycle.json --output site/data/case-law.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
